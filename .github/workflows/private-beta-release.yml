name: Private beta release

# Dispatch only, and two of its three jobs will not start on a fresh
# repository: `staging` and `production` want self-hosted runners
# labelled `choir-staging` and `choir-production`. Without those runners
# registered, pressing "Run workflow" queues those jobs until the run is
# cancelled. `package` runs on a GitHub-hosted runner and is the half
# that works out of the box.

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: Run the production environment approval and promotion after staging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.1
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_CYCLONEDX_VERSION: 0.5.9
  FORCE_COLOR: 1

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_VERSION"

      # The two tools are cached; `target/` deliberately is not. This job
      # builds the bytes that get shipped, and a restored build directory
      # is a place for something to have been put. The gate here is
      # allowed to be slow — it runs on demand, not on every push — and
      # what it buys is that the artifact is compiled from source every
      # time. The tools only decide what to *report*, and both are pinned.
      - name: Cache pinned release tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-cyclonedx
          key: release-tools-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}-${{ env.CARGO_CYCLONEDX_VERSION }}

      - name: Install pinned release tools
        run: |
          command -v cargo-audit >/dev/null \
            || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          command -v cargo-cyclonedx >/dev/null \
            || cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      # A choir-cli test executes choirctl under zsh, which the runner
      # image does not ship; nightly.yml says why it must execute.
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - name: Fail-closed quality gate
        run: |
          ./gate
          cargo audit
      - name: Build checksummed artifact and SBOM
        run: sh scripts/build_private_beta_artifact.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: choir-private-beta-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  staging:
    needs: package
    runs-on: [self-hosted, choir-staging]
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: choir-private-beta-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Atomic staging deployment
        run: |
          artifact=$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -type d | head -1)
          sudo sh scripts/deploy_private_beta.sh "$artifact" "${{ vars.CHOIR_INSTALL_ROOT }}" "${{ vars.CHOIR_SERVICE }}"
      - name: Staging GUI, API, limits, clone, and push smoke
        run: sh scripts/smoke_private_beta.sh "${{ vars.CHOIR_BASE_URL }}" "${{ vars.CHOIR_AUTH_FILE }}" "${{ vars.CHOIR_SMOKE_REPO }}" --push-canary

  production:
    if: inputs.promote_production
    needs: staging
    runs-on: [self-hosted, choir-production]
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: choir-private-beta-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Manually approved atomic production promotion
        run: |
          artifact=$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -type d | head -1)
          sudo sh scripts/deploy_private_beta.sh "$artifact" "${{ vars.CHOIR_INSTALL_ROOT }}" "${{ vars.CHOIR_SERVICE }}"
      - name: Production read-only smoke
        run: sh scripts/smoke_private_beta.sh "${{ vars.CHOIR_BASE_URL }}" "${{ vars.CHOIR_AUTH_FILE }}" "${{ vars.CHOIR_SMOKE_REPO }}"
