name: Bug report
description: Something behaved differently than it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two fields below are the ones that make a report reproducible:
        the `choir doctor` output and the node's `build` line. Please do
        not skip them — nearly every report that stalls, stalls there.

        If this is a security issue, close this form and read
        `SECURITY.md` instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got instead.
      placeholder: |
        $ choir propose ...
        expected: ...
        got: ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`choir doctor` output"
      description: >
        Run `choir doctor` and paste the whole thing. It reports whether
        there is a daemon to serve with and why the last command failed.
        It prints no key and no token.
      render: text
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: The node's `build` line
      description: >
        From `GET /api/view` on the node in question — the `build` field,
        which names the commit the daemon is serving. `choir node status`
        prints it too.
      render: text
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.6 on APFS / Ubuntu 24.04 on ext4
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >
        Relevant decision numbers from `DECISIONS.md`, a rejection code
        from `ERRORS.md`, or the smallest sequence that reproduces it.
    validations:
      required: false
