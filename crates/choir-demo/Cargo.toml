[package]
name = "choir-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Not a release artifact. `choir-demo` is the narrated walkthrough, run
# from a checkout with `cargo run -p choir-demo`; a prebuilt copy on
# somebody's PATH is a binary with nothing to narrate.
[package.metadata.dist]
dist = false

[dependencies]
choir-hash = { path = "../choir-hash" }
choir-identity = { path = "../choir-identity" }
choir-merge = { path = "../choir-merge" }
choir-node = { path = "../choir-node" }
choir-oplog = { path = "../choir-oplog" }
choir-sequencer = { path = "../choir-sequencer" }
choir-store = { path = "../choir-store" }
choir-view = { path = "../choir-view" }

[lints]
workspace = true
