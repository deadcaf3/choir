[package]
name = "choir-queue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Not a release artifact. The three binaries here are the D18 executor
# protocol's second party and its worked example — read against a
# checkout of the protocol, not installed onto a PATH.
[package.metadata.dist]
dist = false

[dependencies]
choir-hash = { path = "../choir-hash" }
choir-merge = { path = "../choir-merge" }
choir-oplog = { path = "../choir-oplog" }
choir-sequencer = { path = "../choir-sequencer" }
choir-store = { path = "../choir-store" }
choir-view = { path = "../choir-view" }
serde_json = { workspace = true }

[lints]
workspace = true
