[package]
name = "choir-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "choir_cli"
path = "src/lib.rs"

[[bin]]
name = "choir"
path = "src/main.rs"

[dependencies]
choir-fs = { path = "../choir-fs" }
choir-hash = { path = "../choir-hash" }
# For the rejection-code table: ERRORS.md is generated alongside the rest
# of the agent surface so one staleness test covers all of it.
choir-node = { path = "../choir-node" }
choir-identity = { path = "../choir-identity" }
# Promoted from a dev-dependency for `choir log --verify`, which rebuilds
# the hashed form from a served page. Not a new dependency to the
# workspace: choir-identity, already here, is built on it.
choir-oplog = { path = "../choir-oplog" }
choir-view = { path = "../choir-view" }
serde_json = "1"

# Where `cargo binstall choir-cli` looks for a prebuilt `choir` rather
# than compiling one. Release-time metadata only: nothing here is
# compiled into the binary, and the from-source path is unchanged and
# still what an operator is expected to use.
#
# The source build stays mandatory for the daemon on purpose. It is the
# *contributor* who should not have to build a Rust workspace before
# their first change, and `choir` is the only binary they need.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/choir-{ target }{ archive-suffix }"
bin-dir = "choir-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dev-dependencies]

[lints]
workspace = true
