[package]
name = "choir-cli"
default-run = "choir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "choir_cli"
path = "src/lib.rs"

[[bin]]
name = "choir"
path = "src/main.rs"

# Forwarded rather than its own: `choir` links `choir-node` for the rejection
# table, and linking that crate is enough to inherit its `libssl`
# soname. The client has no TLS of its own to vendor and still cannot
# be a portable download without this.
[features]
vendored-tls = ["choir-node/vendored-tls"]

[dependencies]
choir-fs = { path = "../choir-fs" }
choir-hash = { path = "../choir-hash" }
# For the rejection-code table: ERRORS.md is generated alongside the rest
# of the agent surface so one staleness test covers all of it.
choir-node = { path = "../choir-node" }
choir-identity = { path = "../choir-identity" }
# Promoted from a dev-dependency for `choir log --verify`, which rebuilds
# the hashed form from a served page. Not a new dependency to the
# workspace: choir-identity, already here, is built on it.
choir-oplog = { path = "../choir-oplog" }
choir-view = { path = "../choir-view" }
serde_json = "1"

# Where `cargo binstall choir-cli` looks for a prebuilt `choir` rather
# than compiling one. Release-time metadata only: nothing here is
# compiled into the binary, and the from-source path is unchanged and
# still what an operator is expected to use.
#
# The source build stays mandatory for the daemon on purpose. It is the
# *contributor* who should not have to build a Rust workspace before
# their first change, and `choir` is the only binary they need.
#
# Every field here mirrors something `dist` decides, and the three that
# matter were all wrong while nothing had ever run: `dist` names an
# archive after the *package*, not the binary, and its unix archive is
# `.tar.xz`. They are written out rather than left to binstall's
# defaults so that the disagreement is visible in one place if dist's
# naming ever changes; `dist plan` prints the names it will use.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/choir-cli-{ target }{ archive-suffix }"
bin-dir = "choir-cli-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dev-dependencies]

[lints]
workspace = true
