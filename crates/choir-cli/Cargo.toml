[package]
name = "choir-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "choir_cli"
path = "src/lib.rs"

[[bin]]
name = "choir"
path = "src/main.rs"

[dependencies]
choir-hash = { path = "../choir-hash" }
choir-identity = { path = "../choir-identity" }
