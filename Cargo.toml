[workspace]
resolver = "2"
members = [
    "crates/choir-actor",
    "crates/choir-bridge",
    "crates/choir-cli",
    "crates/choir-demo",
    "crates/choir-fs",
    "crates/choir-guards",
    "crates/choir-hash",
    "crates/choir-identity",
    "crates/choir-oplog",
    "crates/choir-sequencer",
    "crates/choir-merge",
    "crates/choir-node",
    "crates/choir-queue",
    "crates/choir-spike",
    "crates/choir-store",
    "crates/choir-view",
]

# choir-actor is the D3 second implementation of the actor-runtime seam. It
# pulls rivetkit, tokio and a bundled libsqlite3 that nothing else in the
# workspace touches, and compiling it costs more than the other thirteen
# crates put together. Excluding it from the default set means a bare
# `cargo build`/`cargo test` skips that tree; the seam's conformance suite
# still runs under an explicit `-p choir-actor` or `--workspace`, which is
# what the hand-run gate uses.
default-members = [
    "crates/choir-bridge",
    "crates/choir-cli",
    "crates/choir-demo",
    "crates/choir-fs",
    "crates/choir-guards",
    "crates/choir-hash",
    "crates/choir-identity",
    "crates/choir-oplog",
    "crates/choir-sequencer",
    "crates/choir-merge",
    "crates/choir-node",
    "crates/choir-queue",
    "crates/choir-spike",
    "crates/choir-store",
    "crates/choir-view",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["asxeem"]
# Where releases are downloaded from. `dist` refuses to generate a
# GitHub workflow without it, and `cargo binstall` builds its `pkg-url`
# out of it, so this one string decides where two independent installers
# look. This carried `<owner>` as a placeholder, the way every host and
# account name in a tracked file here does, until the commit that first
# pushed to a remote filled it in. It is the one such name in the tree
# that is meant to be real: it is where the public code lives, and the
# installers read it. Every other host and account name stays a
# placeholder.
repository = "https://github.com/deadcaf3/choir"

# Release packaging (`dist`, formerly `cargo-dist`). Read only by that
# tool, never by a build: it generates the release workflow, the archives
# and the shell installer from this table, so what a contributor
# downloads is described in the repository rather than in CI YAML nobody
# reads.
#
# `choir` and `choir-node` are both published. This reverses the
# original rule here, which was that only the client shipped and an
# operator built the daemon from source "because that is the audited
# path". The audience is what changed: that sentence describes an
# operator who already has a Rust toolchain and a checkout, and the
# person self-hosting a node now is somebody with a fresh VPS and
# neither. Making them install rustup and openssl headers before they
# can run a daemon is the same wall the client install just removed,
# one step further in. The audited path is unchanged and still
# documented; it stopped being the *only* path.
#
# What that costs, and what pays it: a prebuilt daemon must carry its
# own build stamp (`CHOIR_GIT_HEAD`, which the workflow sets, since a
# dist build has no HEAD of its own to read) and must not depend on the
# runner's libssl (`features`, below). Both are release-time
# arrangements; neither changes what a source build does.
#
# `choir-demo`, `choir-spike` and `choir-bridge` opt out in their own
# manifests, each with the reason there.
#
# `dist init` writes the mechanical keys below and reformats this table
# when it does, which is why every comment in it is load-bearing prose
# that has to be put back by hand afterwards rather than a note on a
# line dist owns.
[workspace.metadata.dist]
# The exact packaging tool this release was cut with. Written by `dist
# init`, never by hand: a version typed from memory is a pin that says
# something untrue about how the artifact was built.
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
# The one build difference between a release artifact and a source
# build: statically link OpenSSL, so a downloaded binary does not name
# the runner's `libssl` soname. See `crates/choir-node/Cargo.toml`.
features = ["vendored-tls"]
# The gate is the gate. Release packaging runs after it rather than
# beside it, so nothing is ever published that `./gate` refused: see
# `plan-jobs` below for where that is enforced.
#
# Empty, and spelled out rather than left to the default: nothing here
# is published to crates.io. A registry release is a name nobody can
# take back, and this is a research prototype.
publish-jobs = []
# The quick gate, in front of everything. `plan-jobs` become a job the
# build jobs `needs:`, so a refused gate stops the release before a
# single artifact is built rather than after. The job it names is the
# same reusable workflow `ci.yml` calls.
plan-jobs = ["./gate-quick"]
# Extra steps spliced into every build job, resolved relative to
# `.github/workflows/`. One step, and it is the build stamp:
# `.github/build-setup.yml`, one level up, because GitHub parses every
# file under `workflows/` as a workflow and this one is a step list.
github-build-setup = "../build-setup.yml"

# No self-updater. `choir` telling itself to fetch a new binary is a
# second, unaudited install path, and the one command that installs it
# is also the one command that upgrades it.
install-updater = false

# Native runners for the two Linux targets rather than dist's default,
# which cross-compiles aarch64 on an x86 runner through
# `cargo-zigbuild`. Two reasons, both about this workspace rather than
# a preference: the release build statically links OpenSSL, and
# vendored OpenSSL is a C build with its own configure step that a
# cross toolchain is the least reliable place to run; and a native
# runner is the only build whose `libc` is the one the artifact will
# meet. `ubuntu-22.04-arm` is a GitHub-hosted runner, so this adds no
# self-hosted machine for anybody to maintain.
[workspace.metadata.dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
# `host` is spelled out because dist knows the platform of the runner
# images it shipped with and `ubuntu-22.04-arm` is not one of them; a
# bare string here is rejected rather than guessed, which is the right
# refusal and this is the answer to it.
aarch64-unknown-linux-gnu = { runner = "ubuntu-22.04-arm", host = "aarch64-unknown-linux-gnu" }

[workspace.dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The workspace shipped on cargo defaults until now, which for release
# means lto = false and codegen-units = 16 — the compiler declining to
# optimise across crate boundaries in a workspace that is almost entirely
# crate boundaries.
#
# Deliberately absent: panic = "abort". `Node::serve_forever` spawns a
# thread per request and relies on a panicking handler killing only that
# thread; under abort, one bad request takes down the daemon. Revisit only
# once handlers are proven panic-free.
[profile.release]
opt-level = 3
# "fat", not the usual "thin" default advice. Measured on this workspace,
# fat won every metric including the one it is supposed to lose: clean
# build 169.7 s vs 206.6 s, binary 1.98 MB vs 2.28 MB. Small workspace,
# codegen-units = 1 already, so thin's incrementality buys nothing here and
# its own bookkeeping costs. Re-measure if the workspace grows a lot.
lto = "fat"
codegen-units = 1
strip = true
# Keeps a symbolicatable profile without carrying full debuginfo. `strip`
# removes the symbol table from the binary; this leaves enough for a
# sampling profiler to name frames.
debug = "line-tables-only"

# Full DWARF isn't needed for a suite that asserts behaviour, not
# breakpoints; backtraces still carry line numbers under line-tables-only.
# Applies workspace-wide, including dependency builds below (they only
# override opt-level, so this is inherited).
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in dev builds: they are compiled once and
# then cached, while the workspace crates are rebuilt constantly. This
# keeps `cargo test` from running the whole suite through an unoptimised
# blake3 and ed25519.
[profile.dev.package."*"]
opt-level = 3

# The profile release artifacts are built with. `dist init` writes this
# with `lto = "thin"`; that line is deliberately removed, because
# `[profile.release]` above chose "fat" from a measurement on this
# workspace where fat won every metric including build time. A release
# build is the one build where the measurement matters most, so it
# inherits release and overrides nothing.
[profile.dist]
inherits = "release"

[workspace.lints.rust]
missing_docs = "warn"

# Perf lints, enabled with a measured caveat: they do NOT find the thing
# this optimization pass is chasing.
#
# The expectation was that redundant_clone would flag the full-View clone
# in ChoirPolicy::check. It does not, and cannot: the clone is immediately
# mutated by trial.apply, so it is genuinely used and the lint has nothing
# to complain about. Six redundant_clone hits fired across the workspace
# and every one is in a test or the demo. An O(state) clone on a hot path
# is a design fact, not a lint-visible one.
#
# Kept anyway -- they are cheap and they caught real slips in new code --
# but nobody should read a clean clippy run as evidence of no allocation
# problem.
#
# "warn" not "deny" deliberately: the gate here is run by hand, and a
# denied lint turns an advisory into a broken build for whoever is mid-edit.
[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
# The neighbouring lint, and the reason it is spelled out rather than left
# at its default warn. `broken_intra_doc_links` catches a link to an item
# that does not exist; a link to an item that exists but is *private*
# is a different lint entirely, and it sat at warn while CLAUDE.md told
# readers doc-link integrity was enforced. Two such links lived in
# `assign_reviewers` for two days without anything failing, because no
# gate step ran `cargo doc` at all. Denying it is half the fix; running
# `cargo doc --workspace --no-deps` in the ship gate is the other half.
private_intra_doc_links = "deny"
