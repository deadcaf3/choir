[workspace]
resolver = "2"
members = [
    "crates/choir-oplog",
    "crates/choir-sequencer",
    "crates/choir-merge",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
