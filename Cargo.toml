[workspace]
resolver = "2"
members = [
    "crates/choir-hash",
    "crates/choir-identity",
    "crates/choir-oplog",
    "crates/choir-sequencer",
    "crates/choir-merge",
    "crates/choir-node",
    "crates/choir-queue",
    "crates/choir-spike",
    "crates/choir-store",
    "crates/choir-view",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
